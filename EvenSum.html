<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1 id="head">Even Sum Calculator</h1>
    <form  id="form">
        <label for="input" id="label">enter the number</label>
        <input type="number" placeholder="NUMBER" id="number"> 
    </form>
    <h3 id="res" ></h3>
    <script>
document.addEventListener("keydown",function(event)
{
    if(event.key==="Enter")
{
    event.preventDefault();
    EvenSum();
}
}
);
function EvenSum()
{
    let n=Number(document.getElementById("number").value);
    let sum1=0;
    for(let i=1;i<=n;i++)
{
    if(i%2==0)
{
    sum1=sum1+i;
}

}
document.getElementById("res").innerHTML="SUM OF EVEN NUMBERS IS  "+sum1;
}
    </script>
</body>
</html>
